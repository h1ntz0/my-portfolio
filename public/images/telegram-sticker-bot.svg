<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1621"/>
      <stop offset="100%" stop-color="#17212b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2481cc"/>
      <stop offset="100%" stop-color="#54a9eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Telegram Header Bar -->
  <rect x="40" y="30" width="1120" height="60" rx="12" fill="#17212b" stroke="#242f3d" stroke-width="1"/>
  <circle cx="75" cy="60" r="18" fill="#2481cc"/>
  <!-- Bot icon (robot / send icon) -->
  <path d="M68 60 L79 53 L75 67 L72 61 Z" fill="#ffffff"/>
  <text x="105" y="56" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Sticker Generator Bot</text>
  <text x="105" y="73" fill="#54a9eb" font-family="system-ui, -apple-system, sans-serif" font-size="12">bot • online</text>
  <rect x="1040" y="46" width="90" height="28" rx="14" fill="#242f3d"/>
  <text x="1062" y="65" fill="#708499" font-family="monospace" font-size="12">/stats: 42</text>

  <!-- Left Side: User upload photo -->
  <!-- User Message 1: /start -->
  <g transform="translate(820, 115)" filter="url(#shadow)">
    <rect width="340" height="44" rx="12" fill="#2b5278"/>
    <text x="20" y="27" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14">/start</text>
    <text x="295" y="32" fill="#7ea5cb" font-family="system-ui, sans-serif" font-size="11">14:20</text>
  </g>

  <!-- Bot Message: Welcome -->
  <g transform="translate(40, 175)" filter="url(#shadow)">
    <rect width="520" height="70" rx="12" fill="#182533" stroke="#242f3d" stroke-width="1"/>
    <text x="20" y="28" fill="#54a9eb" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Sticker Bot</text>
    <text x="20" y="48" fill="#f5f5f5" font-family="system-ui, -apple-system, sans-serif" font-size="13">Send me any photo and I'll convert it to a 512x512 WebP sticker!</text>
    <text x="470" y="58" fill="#708499" font-family="system-ui, sans-serif" font-size="11">14:20</text>
  </g>

  <!-- User Message 2: Photo upload (Input) -->
  <g transform="translate(740, 260)" filter="url(#shadow)">
    <rect width="420" height="210" rx="12" fill="#2b5278"/>
    <!-- Photo preview card -->
    <rect x="12" y="12" width="396" height="150" rx="8" fill="#1e3b56"/>
    <!-- Landscape Photo Graphic -->
    <circle cx="100" cy="60" r="20" fill="#ffb703" opacity="0.9"/>
    <path d="M20 145 L110 80 L190 135 L260 95 L400 150 L20 150 Z" fill="#023047" opacity="0.8"/>
    <path d="M80 150 L180 95 L270 145 L350 110 L408 150 Z" fill="#219ebc" opacity="0.6"/>
    <rect x="24" y="24" width="130" height="22" rx="4" fill="#000000" fill-opacity="0.4"/>
    <text x="32" y="39" fill="#ffffff" font-family="monospace" font-size="11">Original: 1920x1080</text>
    <text x="20" y="190" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13">Converting to sticker...</text>
    <text x="375" y="198" fill="#7ea5cb" font-family="system-ui, sans-serif" font-size="11">14:21</text>
  </g>

  <!-- Processing Indicator / Pipeline Badge -->
  <g transform="translate(480, 485)">
    <rect width="240" height="32" rx="16" fill="#1e2c3a" stroke="#2481cc" stroke-width="1"/>
    <circle cx="24" cy="16" r="5" fill="#4ade80"/>
    <text x="40" y="21" fill="#54a9eb" font-family="monospace" font-size="12" font-weight="600">Pillow 512x512 WebP</text>
  </g>

  <!-- Bot Message 2: Sticker Response Output -->
  <g transform="translate(40, 520)" filter="url(#shadow)">
    <rect width="420" height="190" rx="12" fill="#182533" stroke="#242f3d" stroke-width="1"/>
    <!-- Transparent Grid Box for 512x512 WebP -->
    <rect x="16" y="16" width="150" height="150" rx="10" fill="#0f1722" stroke="#54a9eb" stroke-dasharray="4,4" stroke-width="1.5"/>
    
    <!-- Transparent checkerboard preview -->
    <pattern id="check" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#1b2734"/>
      <rect x="5" width="5" height="5" fill="#141e2a"/>
      <rect y="5" width="5" height="5" fill="#141e2a"/>
      <rect x="5" y="5" width="5" height="5" fill="#1b2734"/>
    </pattern>
    <rect x="22" y="22" width="138" height="138" fill="url(#check)" rx="6"/>
    <!-- The Resized Padded Sticker Graphic inside 512 box -->
    <rect x="26" y="45" width="130" height="75" rx="4" fill="#219ebc" opacity="0.9" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="55" cy="65" r="10" fill="#ffb703"/>
    <path d="M28 115 L65 85 L95 105 L130 85 L154 115 Z" fill="#023047"/>

    <!-- Text info on sticker card -->
    <text x="180" y="45" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">✓ Sticker Ready!</text>
    <text x="180" y="72" fill="#e2e8f0" font-family="monospace" font-size="12">Format: WebP (Lossless)</text>
    <text x="180" y="94" fill="#94a3b8" font-family="monospace" font-size="12">Dimension: 512 x 512 px</text>
    <text x="180" y="116" fill="#94a3b8" font-family="monospace" font-size="12">Padding: Transparent</text>
    <rect x="180" y="132" width="160" height="28" rx="6" fill="#2481cc"/>
    <text x="205" y="151" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Add to Telegram</text>
    <text x="375" y="175" fill="#708499" font-family="system-ui, sans-serif" font-size="11">14:21</text>
  </g>
</svg>