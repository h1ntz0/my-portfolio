<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-ttt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cell-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="win-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow-x" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-o" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.8"/>
    </filter>
    <filter id="shadow-app" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad-ttt)"/>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- React Web Browser Frame -->
  <g filter="url(#shadow-app)">
    <rect x="60" y="35" width="680" height="430" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Browser Top Bar -->
    <path d="M 60 47 C 60 40.37 65.37 35 72 35 L 728 35 C 734.63 35 740 40.37 740 47 L 740 75 L 60 75 Z" fill="#090d16"/>
    <line x1="60" y1="75" x2="740" y2="75" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Browser Controls -->
    <circle cx="85" cy="55" r="5" fill="#ef4444"/>
    <circle cx="102" cy="55" r="5" fill="#f59e0b"/>
    <circle cx="119" cy="55" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="180" y="44" width="380" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <text x="370" y="59" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">localhost:3000 React Tic-Tac-Toe</text>

    <!-- React Tag -->
    <rect x="635" y="45" width="85" height="20" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <text x="677" y="59" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">⚛ React 18</text>
  </g>

  <!-- Left: Tic Tac Toe 3x3 Grid -->
  <g transform="translate(100, 105)">
    <!-- Game Board Box -->
    <!-- Row 0 -->
    <rect x="0" y="0" width="85" height="85" rx="8" fill="url(#cell-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="42.5" y="58" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle" filter="url(#glow-x)">X</text>

    <rect x="95" y="0" width="85" height="85" rx="8" fill="url(#cell-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="137.5" y="58" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle" filter="url(#glow-o)">O</text>

    <rect x="190" y="0" width="85" height="85" rx="8" fill="url(#cell-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="232.5" y="58" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle" filter="url(#glow-x)">X</text>

    <!-- Row 1 (Winning Line Highlighted) -->
    <rect x="0" y="95" width="85" height="85" rx="8" fill="url(#win-grad)" stroke="#10b981" stroke-width="2"/>
    <text x="42.5" y="153" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle">X</text>

    <rect x="95" y="95" width="85" height="85" rx="8" fill="url(#win-grad)" stroke="#10b981" stroke-width="2"/>
    <text x="137.5" y="153" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle">X</text>

    <rect x="190" y="95" width="85" height="85" rx="8" fill="url(#win-grad)" stroke="#10b981" stroke-width="2"/>
    <text x="232.5" y="153" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle">X</text>

    <!-- Row 2 -->
    <rect x="0" y="190" width="85" height="85" rx="8" fill="url(#cell-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="42.5" y="248" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle" filter="url(#glow-o)">O</text>

    <rect x="95" y="190" width="85" height="85" rx="8" fill="url(#cell-grad)" stroke="#334155" stroke-width="1.5"/>
    <!-- empty cell -->

    <rect x="190" y="190" width="85" height="85" rx="8" fill="url(#cell-grad)" stroke="#334155" stroke-width="1.5"/>
    <text x="232.5" y="248" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle" filter="url(#glow-o)">O</text>
  </g>

  <!-- Right: Game State, History & Controls -->
  <g transform="translate(420, 105)" font-family="system-ui, sans-serif">
    <!-- Status Banner -->
    <rect x="0" y="0" width="280" height="55" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="24" fill="#34d399" font-size="11" font-weight="700" letter-spacing="0.5">STATUS</text>
    <text x="20" y="44" fill="#ffffff" font-size="15" font-weight="700">Winner: Player X 🎉</text>

    <!-- Move History / State Inspection -->
    <rect x="0" y="70" width="280" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="18" y="93" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">TIME TRAVEL / MOVE HISTORY</text>
    
    <text x="18" y="118" fill="#cbd5e1" font-size="12">1. Move #1: Player X at (0, 0)</text>
    <text x="18" y="138" fill="#cbd5e1" font-size="12">2. Move #2: Player O at (0, 1)</text>
    <text x="18" y="158" fill="#cbd5e1" font-size="12">3. Move #3: Player X at (1, 0)</text>
    <text x="18" y="178" fill="#cbd5e1" font-size="12">4. Move #4: Player O at (2, 0)</text>
    <text x="18" y="198" fill="#10b981" font-weight="600" font-size="12">5. Move #5: Player X at (1, 2) [WIN]</text>

    <!-- Reset Button -->
    <rect x="0" y="235" width="280" height="40" rx="6" fill="#0284c7" />
    <text x="140" y="260" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Restart Game (New Match)</text>
  </g>
</svg>